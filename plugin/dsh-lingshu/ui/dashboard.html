<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LINGSHU · 人格体中枢</title>
<style>
  :root { color-scheme: dark; --bg:#0f1420; --fg:#e8edf7; --muted:#93a0b8; --card:#171e2c; --line:#26304a; --accent:#6ea8fe; --danger:#e06c75; --ok:#7fd1a1; --warn:#ffb86b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  a.link { color:var(--accent); text-decoration:none; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  a.link:hover { border-color:var(--accent); }
  main { padding:16px 20px; display:grid; gap:16px; max-width:1200px; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  @media (max-width:900px){ .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .stat .k { color:var(--muted); font-size:12px; }
  .stat .v { font-size:20px; font-weight:700; margin-top:2px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  @media (max-width:820px){ .grid { grid-template-columns:1fr; } }
  .persona { border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:linear-gradient(180deg,rgba(110,168,254,.06),transparent 60%); }
  .phead { display:flex; align-items:center; gap:8px; }
  .phead h3 { margin:0; font-size:15px; flex:1; }
  .pid { color:var(--muted); font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .summary { color:var(--muted); font-size:12px; max-height:58px; overflow:auto; margin:6px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 9px; font-size:11px; color:var(--muted); }
  .chip.bound { color:var(--ok); border-color:var(--ok); }
  .chip.current { color:var(--accent); border-color:var(--accent); }
  .bind-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; font-size:12px; }
  input[type=number] { width:70px; }
  textarea { width:100%; min-height:56px; resize:vertical; }
  button { background:transparent; color:var(--accent); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12px; }
  button.primary { border-color:var(--accent); background:rgba(110,168,254,.12); }
  button.unbind { color:var(--danger); border-color:var(--danger); background:rgba(224,108,117,.10); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  .hintline { color:var(--muted); font-size:11px; margin-top:6px; min-height:16px; }
  .traits { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-top:6px; }
  @media (max-width:820px){ .traits { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .traits label { color:var(--muted); font-size:11px; display:flex; flex-direction:column; gap:4px; }
  .status { color:var(--muted); font-size:12px; }
  .error { color:var(--danger); font-size:12px; }
  .empty { color:var(--muted); font-size:13px; padding:8px 0; }
  .toast { position:fixed; right:18px; bottom:18px; background:#1d2638; border:1px solid var(--line); color:var(--fg); padding:8px 12px; border-radius:8px; font-size:12px; box-shadow:0 6px 20px rgba(0,0,0,.4); display:none; }
</style>
</head>
<body>
<header>
  <h1>LINGSHU 人格体中枢</h1>
  <span class="sub" id="current">当前人格舱：—</span>
  <span class="spacer"></span>
  <a class="link" href="/dsh-lingshu/dashboard/memory">记忆面板</a>
  <a class="link" href="#" id="reload">刷新</a>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="k">人格体</div><div class="v" id="s-personas">—</div></div>
    <div class="stat"><div class="k">已绑定人格舱</div><div class="v" id="s-bound">—</div></div>
    <div class="stat"><div class="k">记忆条数</div><div class="v" id="s-mem">—</div></div>
    <div class="stat"><div class="k">运行态</div><div class="v" id="s-mode">—</div></div>
  </div>

  <section>
    <h2>人格体（卡片右上角：未绑定=「绑定」，已绑定=「解绑」）</h2>
    <div class="grid" id="personas"><div class="empty">加载中…</div></div>
  </section>

  <section>
    <h2>创建人格体</h2>
    <div class="bind-row" style="align-items:flex-start;flex-direction:column">
      <input id="p-name" placeholder="名称（必填），例如：鲸鲸" style="width:260px" />
      <textarea id="p-summary" placeholder="摘要（可选）：称呼习惯 / 说话风格 / 边界"></textarea>
    </div>
    <div class="traits">
      <label>正式度<input id="t-formality" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>温度<input id="t-warmth" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>主动性<input id="t-proactiveness" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>幽默度<input id="t-humor" type="number" min="0" max="1" step="0.05" value="0.3" /></label>
      <label>边界强度<input id="t-boundary" type="number" min="0" max="1" step="0.05" value="0.7" /></label>
    </div>
    <div class="bind-row" style="margin-top:10px"><button id="create" class="primary">创建人格体</button></div>
    <div class="status" id="create-status"></div>
  </section>

  <div class="status" id="status">加载中…</div>
</main>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var API = {
    personas: '/dsh-lingshu/api/personas',
    available: '/dsh-lingshu/api/workspaces/available',
    bind: '/dsh-lingshu/api/bindings',
    unbind: '/dsh-lingshu/api/bindings/unbind',
    status: '/dsh-lingshu/api/status',
  };
  var state = { personas: [], workspaces: [], status: null };
  var drafts = {};                       // pid -> { target, manual }
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function norm(p) {
    return String(p || '').trim().replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
  }

  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!j || j.ok !== true) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    window.clearTimeout(toast._timer);
    toast._timer = window.setTimeout(function () { t.style.display = 'none'; }, 2600);
  }

  function candidates() {
    return state.workspaces.filter(function (w) { return w.exists; });
  }

  function defaultTarget() {
    var list = candidates();
    var cur = null;
    for (var i = 0; i < list.length; i++) { if (list[i].source === 'current') { cur = list[i]; break; } }
    return (cur || list[0] || {}).workspace_root || '';
  }

  function workspaceLabel(w) {
    var bound = w.bound_persona_id ? ('（已被 ' + w.bound_persona_id + ' 绑定）') : '';
    return (w.label || w.workspace_root) + '  ·  ' + w.workspace_root + bound;
  }

  function bindingOf(persona, target) {
    var t = norm(target);
    if (!t) return null;
    var bs = persona.bindings || [];
    for (var i = 0; i < bs.length; i++) {
      if (norm(bs[i].canonical_path) === t) return bs[i];
    }
    return null;
  }

  function bindingOwner(target) {
    for (var i = 0; i < state.personas.length; i++) {
      if (bindingOf(state.personas[i], target)) return state.personas[i].persona_id;
    }
    return null;
  }

  function effectiveTarget(d) {
    return String(d.manual || '').trim() || String(d.target || '');
  }

  function syncToggle(persona, d, btn, hint) {
    var target = effectiveTarget(d);
    var own = bindingOf(persona, target);
    var owner = own ? persona.persona_id : bindingOwner(target);
    if (!target) {
      btn.textContent = '绑定'; btn.className = 'primary'; btn.disabled = true;
      if (hint) hint.textContent = '先选择或填写人格舱路径';
      return;
    }
    if (own) {
      btn.textContent = '解绑'; btn.className = 'unbind'; btn.disabled = false;
      if (hint) hint.textContent = '已绑定到 ' + own.canonical_path + '，点击「解绑」解除';
    } else if (owner && owner !== persona.persona_id) {
      btn.textContent = '已被 ' + owner + ' 绑定'; btn.className = ''; btn.disabled = true;
      if (hint) hint.textContent = '该人格舱已绑定其他人格体，先解绑那边或换一个';
    } else {
      btn.textContent = '绑定'; btn.className = 'primary'; btn.disabled = false;
      if (hint) hint.textContent = '点击「绑定」把 ' + target + ' 绑给 ' + persona.name;
    }
  }

  function renderPersonas() {
    var box = $('personas');
    box.textContent = '';
    if (!state.personas.length) {
      box.appendChild(el('div', 'empty', '还没有人格体。在下方创建一个，然后给卡片选择人格舱。'));
      return;
    }
    var list = candidates();
    state.personas.forEach(function (p) {
      if (!drafts[p.persona_id]) drafts[p.persona_id] = { target: defaultTarget(), manual: '' };
      var d = drafts[p.persona_id];
      var known = list.some(function (w) { return norm(w.workspace_root) === norm(d.target); });
      if (!known) d.target = defaultTarget();

      var card = el('div', 'persona');
      var head = el('div', 'phead');
      var h = el('h3', null, p.name);
      head.appendChild(h);
      head.appendChild(el('span', 'pid', p.persona_id));
      var btn = el('button', 'primary', '绑定');
      head.appendChild(btn);
      card.appendChild(head);
      card.appendChild(el('div', 'summary', p.summary || '（无摘要）'));

      var chips = el('div', 'chips');
      if (!p.bindings.length) {
        chips.appendChild(el('span', 'chip', '未绑定任何人格舱'));
      } else {
        p.bindings.forEach(function (b) {
          chips.appendChild(el('span', 'chip bound', b.canonical_path));
        });
      }
      card.appendChild(chips);

      var row = el('div', 'bind-row');
      var sel = null;
      if (list.length) {
        sel = el('select');
        list.forEach(function (w) {
          var opt = el('option');
          opt.value = w.workspace_root;
          opt.textContent = workspaceLabel(w);
          if (w.source === 'current') opt.classList.add('current');
          sel.appendChild(opt);
        });
        if (d.target) sel.value = d.target;
        sel.addEventListener('change', function () {
          d.target = sel.value;
          d.manual = '';
          manual.value = '';
          syncToggle(p, d, btn, hint);
        });
        row.appendChild(sel);
      }
      var manual = el('input');
      manual.placeholder = '或手填人格舱路径，如 D:\\qq鲸鱼（优先）';
      manual.value = d.manual || '';
      manual.style.minWidth = '210px';
      manual.addEventListener('input', function () {
        d.manual = manual.value;
        syncToggle(p, d, btn, hint);
      });
      row.appendChild(manual);
      card.appendChild(row);

      var hint = el('div', 'hintline', '');
      card.appendChild(hint);
      syncToggle(p, d, btn, hint);

      btn.addEventListener('click', function () {
        var target = effectiveTarget(d);
        if (!target || btn.disabled) return;
        var isUnbind = Boolean(bindingOf(p, target));
        if (isUnbind && !window.confirm('解绑后该人格舱将不再加载任何人格（记忆保留）。确定？')) return;
        btn.disabled = true;
        api(isUnbind ? API.unbind : API.bind, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(isUnbind
            ? { workspace_root: target }
            : { persona_id: p.persona_id, workspace_root: target }),
        }).then(function () { return refresh(); }).then(function () {
          toast((isUnbind ? '已解绑：' : '已绑定：') + target + ' → ' + p.name);
        }).catch(function (e) {
          btn.disabled = false;
          toast((isUnbind ? '解绑失败：' : '绑定失败：') + e.message);
        });
      });

      box.appendChild(card);
    });
  }

  function renderStats() {
    var bound = state.personas.reduce(function (n, p) { return n + (p.bindings || []).length; }, 0);
    var mem = state.status && state.status.memory ? Number(state.status.memory.total || 0) : null;
    $('s-personas').textContent = String(state.personas.length);
    $('s-bound').textContent = String(bound);
    $('s-mem').textContent = mem === null ? '—' : String(mem);
    $('s-mode').textContent = state.status ? String(state.status.mode || '—') : '—';
    var cur = (state.workspaces || []).filter(function (w) { return w.source === 'current'; })[0];
    $('current').textContent = '当前人格舱：' + (cur ? (cur.workspace_root + (cur.bound_persona_id ? '（已绑定 ' + cur.bound_persona_id + '）' : '（未绑定，不加载人格）')) : '未知');
  }

  function refresh() {
    return Promise.all([
      api(API.personas).then(function (j) { state.personas = j.personas || []; }),
      api(API.available).then(function (j) { state.workspaces = j.workspaces || []; }),
      api(API.status).catch(function () { return null; }).then(function (j) { state.status = j; }),
    ]).then(function () {
      renderPersonas();
      renderStats();
      var bound = state.workspaces.filter(function (w) { return w.bound_persona_id; }).length;
      $('status').textContent = '共 ' + state.personas.length + ' 个人格体 ｜ 人格舱候选 '
        + candidates().length + ' 个（已绑定 ' + bound + '）｜ 页面 20s 自动刷新';
    }).catch(function (e) {
      var s = $('status');
      s.className = 'error';
      s.textContent = '加载失败：' + e.message + '（v0.2 布局未启用时不可用）';
    });
  }

  $('create').addEventListener('click', function () {
    var name = String($('p-name').value || '').trim();
    if (!name) { $('create-status').textContent = '名称必填'; return; }
    var body = {
      name: name,
      summary: String($('p-summary').value || ''),
      traits: {
        formality: Number($('t-formality').value),
        warmth: Number($('t-warmth').value),
        proactiveness: Number($('t-proactiveness').value),
        humor: Number($('t-humor').value),
        boundary_firmness: Number($('t-boundary').value),
      },
    };
    api(API.personas, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    }).then(function (j) {
      $('create-status').textContent = '已创建：' + j.persona.persona_id + ' ' + j.persona.name;
      $('p-name').value = ''; $('p-summary').value = '';
      return refresh();
    }).catch(function (e) { $('create-status').textContent = '创建失败：' + e.message; });
  });

  $('reload').addEventListener('click', function (e) { e.preventDefault(); refresh(); });
  refresh();
  window.setInterval(refresh, 20000);
})();
</script>
</body>
</html>
