    <div id="root"></div><style id="lh-dsh-theme">
  html[data-lh-theme] { color-scheme: light; }

(function () {

  }

      if (!p || p === window || !p.document || !p.document.body) return null;

  function personaMoods() {
    return Promise.all([
      fetch('/dsh-lingshu/api/personas', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),

          label: label,
          emoji: MOOD_EMOJI[label] || '😶',
          from: hits[0].canonicalPath || hits[0].workspaceId || '',
        };
      });
      moodMap = map;
      paintMoods();
    }).catch(function () { /* 拉不到就维持上一轮 */ });
  }

  function paintMoods() {
    if (!moodMap) return;
    var nodes = document.querySelectorAll('.lh-mood[data-pid]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var m = moodMap[el.getAttribute('data-pid')];
      var text = m ? m.emoji : '😶';
      if (el.textContent !== text) el.textContent = text;
      var title = m
        ? '心情：' + m.label + (m.from ? '｜来自 ' + m.from : '')
        : '心情：未知｜该人格体未绑定人格舱';
      if (el.title !== title) el.title = title;
      var aria = '心情：' + (m ? m.label : '未知');
      if (el.getAttribute('aria-label') !== aria) el.setAttribute('aria-label', aria);
    }
  }

  apply();
  try {
    var p = window.parent;
    if (p && p !== window && p.document && window.MutationObserver) {
      new MutationObserver(apply).observe(p.document.documentElement, {
        attributes: true, attributeFilter: ['class', 'style', 'data-theme', 'data-theme-mode'],
      });
    }
  } catch (e) { /* 跨源：只靠轮询 */ }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', apply);
    else if (mq.addListener) mq.addListener(apply);
  }
  window.setInterval(apply, 3000);

  // 卡片重建时 React 会冲掉表情文本，这里重新贴一遍。
  try {
    personaMoods();
    window.setInterval(personaMoods, 15000);
    var host = document.getElementById('root');
    if (host && window.MutationObserver) {
      new MutationObserver(function () { paintMoods(); }).observe(host, { childList: true, subtree: true });
    }
    [200, 600, 1500, 3000].forEach(function (ms) { window.setTimeout(paintMoods, ms); });
  } catch (e) { /* 面板页面才会有这一步 */ }
})();
</script>
