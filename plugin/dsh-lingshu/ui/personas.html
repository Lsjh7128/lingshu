<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LINGSHU · 人格体 / 人格舱</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1420; --fg:#e8edf7; --muted:#93a0b8; --card:#171e2c; --line:#26304a; --accent:#6ea8fe; --danger:#e06c75; --ok:#7fd1a1; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .hint { color:var(--muted); font-size:12px; }
  main { padding:16px 20px; display:grid; gap:16px; max-width:1080px; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  .persona { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .persona-head { display:flex; align-items:center; gap:8px; }
  .persona-head h3 { margin:0; font-size:14px; flex:1; }
  .mood { margin-left:6px; font-size:15px; line-height:1; cursor:default; }
  .mood[data-label="中性"] { opacity:.7; }
  .persona .summary { color:var(--muted); font-size:12px; max-height:54px; overflow:auto; margin:4px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 9px; font-size:11px; color:var(--muted); }
  .chip.bound { color:var(--ok); border-color:var(--ok); }
  .bind-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; font-size:12px; }
  textarea { width:100%; min-height:64px; resize:vertical; }
  button { background:transparent; color:var(--accent); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12px; }
  button.primary { border-color:var(--accent); }
  button.unbind { color:var(--danger); border-color:var(--danger); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  .traits { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin-top:6px; }
  .traits label { margin:0; display:flex; align-items:center; gap:6px; }
  .traits input { width:72px; }
  .status { color:var(--muted); font-size:12px; }
  .error { color:var(--danger); font-size:12px; }
  .tag { border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--muted); }
  .hintline { color:var(--muted); font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>LINGSHU 人格体中枢</h1>
  <span class="hint">创建人格体 → 绑定人格舱（DSH 工作区）→ 该人格舱下所有会话共用人格体。没有绑定的人格舱不加载任何人格、不读写记忆。</span>
</header>
<main>
  <section>
    <h2>人格体</h2>
    <div id="personas"><div class="status">加载中…</div></div>
  </section>
  <section>
    <h2>创建人格体</h2>
    <label>名称 <input id="p-name" placeholder="例如：鲸鲸" /></label>
    <label>摘要（可选）<textarea id="p-summary" placeholder="说话习惯 / 自称 / 边界"></textarea></label>
    <div class="traits">
      <label>正式度 <input id="t-formality" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>温度 <input id="t-warmth" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>主动性 <input id="t-proactiveness" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>幽默度 <input id="t-humor" type="number" min="0" max="1" step="0.05" value="0.3" /></label>
      <label>边界强度 <input id="t-boundary" type="number" min="0" max="1" step="0.05" value="0.7" /></label>
    </div>
    <div class="bind-row"><button id="create" class="primary">创建人格体</button></div>
    <div class="status" id="create-status"></div>
  </section>
  <div class="status" id="status">加载中…</div>
</main>
<script>
(function () {
  'use strict';
  var API = {
    personas: '/dsh-lingshu/api/personas',
    available: '/dsh-lingshu/api/workspaces/available',
    workspaces: '/dsh-lingshu/api/workspaces',
    bind: '/dsh-lingshu/api/bindings',
    unbind: '/dsh-lingshu/api/bindings/unbind',
  };
  var state = { personas: [], workspaces: [], workspacesFull: [] };
  var drafts = {};                       // pid -> { target, manual }
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function norm(p) {
    return String(p || '').trim().replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
  }

  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!j || j.ok !== true) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function candidates() {
    return state.workspaces.filter(function (w) { return w.exists; });
  }

  function defaultTarget() {
    var list = candidates();
    var cur = null;
    for (var i = 0; i < list.length; i++) { if (list[i].source === 'current') { cur = list[i]; break; } }
    return (cur || list[0] || {}).workspace_root || '';
  }

  function workspaceLabel(w) {
    var bound = w.bound_persona_id ? ('（已被 ' + w.bound_persona_id + ' 绑定）') : '';
    return (w.label || w.workspace_root) + '  ·  ' + w.workspace_root + bound;
  }

  function bindingOf(persona, target) {
    var t = norm(target);
    if (!t) return null;
    var bs = persona.bindings || [];
    for (var i = 0; i < bs.length; i++) {
      if (norm(bs[i].canonical_path) === t) return bs[i];
    }
    return null;
  }

  function bindingOwner(target) {
    var t = norm(target);
    if (!t) return null;
    for (var i = 0; i < state.personas.length; i++) {
      if (bindingOf(state.personas[i], target)) return state.personas[i].persona_id;
    }
    return null;
  }

  function effectiveTarget(d) {
    return String(d.manual || '').trim() || String(d.target || '');
  }

  // ── 心情表情（v1：五态）─────────────────────────────────
  // 数据源：GET /dsh-lingshu/api/workspaces 的 emotion.label（LINGSHU emotionLabel 五态）。
  // 连接键：persona.bindings[].sandbox_id ≡ workspace.workspaceId。
  // （workspace.persona 里没有 persona_id，不能按 id 直连。）
  // v2 若后端补 mood 字段，这里优先用它，其余不动。
  var MOOD_EMOJI = { '中性': '😐', '愉悦': '🙂', '振奋': '😃', '不满': '😕', '低落': '😔' };
  var MOOD_UNKNOWN = '😶';

  function workspaceOfPersona(p) {
    var ids = (p.bindings || []).map(function (b) { return b.sandbox_id; }).filter(Boolean);
    if (!ids.length) return null;
    var hits = state.workspacesFull.filter(function (w) {
      return w && ids.indexOf(w.workspaceId) >= 0;
    });
    if (!hits.length) return null;
    hits.sort(function (a, b) {
      return (Number(b.isCurrent) - Number(a.isCurrent)) || (Number(b.turns || 0) - Number(a.turns || 0));
    });
    return hits[0];
  }

  function moodOf(p) {
    if (p.mood && p.mood.label) {
      return { label: p.mood.label, emoji: MOOD_EMOJI[p.mood.label] || MOOD_UNKNOWN, from: null };
    }
    var w = workspaceOfPersona(p);
    if (!w) return { label: '未知', emoji: MOOD_UNKNOWN, from: null };
    var label = (w.emotion && w.emotion.label) || '中性';
    return { label: label, emoji: MOOD_EMOJI[label] || MOOD_UNKNOWN, from: w };
  }

  function moodTitle(m) {
    if (!m.from) return '心情：' + m.label + '｜该人格体未绑定人格舱，无心情数据';
    return '心情：' + m.label + '｜来自 ' + (m.from.canonicalPath || m.from.workspaceId);
  }

  /** 刷新卡片右上角按钮：绑定 / 解绑 / 已被他人绑定。 */
  function syncToggle(persona, d, btn, hint) {
    var target = effectiveTarget(d);
    var own = bindingOf(persona, target);
    var owner = own ? persona.persona_id : bindingOwner(target);
    if (!target) {
      btn.textContent = '绑定';
      btn.className = 'primary';
      btn.disabled = true;
      if (hint) hint.textContent = '先选择或填写人格舱路径';
      return;
    }
    if (own) {
      btn.textContent = '解绑';
      btn.className = 'unbind';
      btn.disabled = false;
      if (hint) hint.textContent = '已绑定到 ' + own.canonical_path + '，点击「解绑」解除';
    } else if (owner && owner !== persona.persona_id) {
      btn.textContent = '已被 ' + owner + ' 绑定';
      btn.className = '';
      btn.disabled = true;
      if (hint) hint.textContent = '该人格舱已绑定其他人格体，先解绑那边或换一个';
    } else {
      btn.textContent = '绑定';
      btn.className = 'primary';
      btn.disabled = false;
      if (hint) hint.textContent = '点击「绑定」把 ' + target + ' 绑给 ' + persona.name;
    }
  }

  function renderPersonas() {
    var box = $('personas');
    box.textContent = '';
    if (!state.personas.length) {
      box.appendChild(el('div', 'status', '还没有人格体。右侧创建一个，然后绑定到人格舱。'));
      return;
    }
    var list = candidates();
    state.personas.forEach(function (p) {
      if (!drafts[p.persona_id]) drafts[p.persona_id] = { target: defaultTarget(), manual: '' };
      var d = drafts[p.persona_id];
      var known = list.some(function (w) { return norm(w.workspace_root) === norm(d.target); });
      if (!known) d.target = defaultTarget();

      var card = el('div', 'persona');
      var head = el('div', 'persona-head');
      var h = el('h3');
      h.appendChild(document.createTextNode(p.name + ' '));
      var m = moodOf(p);
      var moodEl = el('span', 'mood', m.emoji);
      moodEl.setAttribute('data-label', m.label);
      moodEl.setAttribute('role', 'img');
      moodEl.setAttribute('aria-label', '心情：' + m.label);
      moodEl.title = moodTitle(m);
      h.appendChild(moodEl);
      head.appendChild(h);
      var btn = el('button', 'primary', '绑定');
      head.appendChild(btn);
      card.appendChild(head);
      card.appendChild(el('div', 'summary', p.summary || '（无摘要）'));

      var chips = el('div', 'chips');
      if (!p.bindings.length) {
        chips.appendChild(el('span', 'chip', '未绑定任何人格舱'));
      } else {
        p.bindings.forEach(function (b) {
          chips.appendChild(el('span', 'chip bound', b.canonical_path));
        });
      }
      card.appendChild(chips);

      var row = el('div', 'bind-row');
      var sel = null;
      if (list.length) {
        sel = el('select');
        list.forEach(function (w) {
          var opt = el('option');
          opt.value = w.workspace_root;
          opt.textContent = workspaceLabel(w);
          sel.appendChild(opt);
        });
        if (d.target) sel.value = d.target;
        sel.addEventListener('change', function () {
          d.target = sel.value;
          d.manual = '';
          manual.value = '';
          syncToggle(p, d, btn, hint);
        });
        row.appendChild(sel);
      }
      var manual = el('input');
      manual.placeholder = '或手填人格舱路径，如 D:\\qq鲸鱼（优先）';
      manual.value = d.manual || '';
      manual.style.minWidth = '220px';
      manual.addEventListener('input', function () {
        d.manual = manual.value;
        syncToggle(p, d, btn, hint);
      });
      row.appendChild(manual);
      card.appendChild(row);

      var hint = el('div', 'hintline', '');
      card.appendChild(hint);
      syncToggle(p, d, btn, hint);

      btn.addEventListener('click', function () {
        var target = effectiveTarget(d);
        if (!target || btn.disabled) return;
        var own = bindingOf(p, target);
        var isUnbind = Boolean(own);
        if (isUnbind && !window.confirm('解绑后该人格舱将不再加载任何人格（记忆保留）。确定？')) return;
        btn.disabled = true;
        api(isUnbind ? API.unbind : API.bind, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(isUnbind
            ? { workspace_root: target }
            : { persona_id: p.persona_id, workspace_root: target }),
        }).then(function () { return refresh(); }).then(function () {
          $('status').textContent = (isUnbind ? '已解绑：' : '已绑定：') + target + ' → ' + p.name;
        }).catch(function (e) {
          btn.disabled = false;
          $('status').textContent = (isUnbind ? '解绑失败：' : '绑定失败：') + e.message;
        });
      });

      box.appendChild(card);
    });
  }

  function refresh() {
    return Promise.all([
      api(API.personas).then(function (j) { state.personas = j.personas || []; }),
      api(API.available).then(function (j) { state.workspaces = j.workspaces || []; }),
      // 心情数据是装饰性的：拉取失败不影响卡片主体，沿用上一轮结果。
      api(API.workspaces).then(function (j) { state.workspacesFull = j.workspaces || []; })
        .catch(function () { /* noop */ }),
    ]).then(function () {
      renderPersonas();
      var bound = state.workspaces.filter(function (w) { return w.bound_persona_id; }).length;
      $('status').textContent = '人格体 ' + state.personas.length + ' 个 ｜ 人格舱候选 '
        + candidates().length + ' 个（已绑定 ' + bound + '）｜ 当前人格舱：' + defaultTarget();
    }).catch(function (e) {
      var s = $('status');
      s.className = 'error';
      s.textContent = '加载失败：' + e.message + '（v0.2 布局未启用时不可用）';
    });
  }

  $('create').addEventListener('click', function () {
    var name = String($('p-name').value || '').trim();
    if (!name) { $('create-status').textContent = '名称必填'; return; }
    var body = {
      name: name,
      summary: String($('p-summary').value || ''),
      traits: {
        formality: Number($('t-formality').value),
        warmth: Number($('t-warmth').value),
        proactiveness: Number($('t-proactiveness').value),
        humor: Number($('t-humor').value),
        boundary_firmness: Number($('t-boundary').value),
      },
    };
    api(API.personas, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    }).then(function (j) {
      $('create-status').textContent = '已创建：' + j.persona.persona_id + ' ' + j.persona.name;
      $('p-name').value = ''; $('p-summary').value = '';
      return refresh();
    }).catch(function (e) { $('create-status').textContent = '创建失败：' + e.message; });
  });

  refresh();
  window.setInterval(refresh, 20000);
})();
</script>

<style id="lh-dsh-theme">
  /* 跟随 DSH 主题：颜色由下面的脚本从父页面采样后写入 CSS 变量 */
  html[data-lh-theme] { color-scheme: light; }
  html[data-lh-theme="dark"] { color-scheme: dark; }
  html[data-lh-theme] body { background: var(--lh-bg) !important; color: var(--lh-fg); }
  html[data-lh-theme] .min-h-screen.bg-gradient-to-br {
    background-image: none !important; background-color: var(--lh-bg) !important;
  }
  html[data-lh-theme] [class*="radial-gradient"] { background-image: none !important; }
  /* 卡片/统计条/搜索框用的都是自定义 .glass（background:#fff9），不是 bg-white */
  html[data-lh-theme] .glass {
    background-color: var(--lh-surface) !important;
    border-color: var(--lh-line) !important;
  }
  html[data-lh-theme] .glass-sheen:before {
    background: linear-gradient(90deg, transparent, var(--lh-line), transparent) !important;
  }
  html[data-lh-theme] [class*="bg-white"] { background-color: var(--lh-surface) !important; }
  html[data-lh-theme] [class*="border-white"] { border-color: var(--lh-line) !important; }
  html[data-lh-theme] [class*="text-ink-900"] { color: var(--lh-fg) !important; }
  html[data-lh-theme] [class*="text-ink-700"] { color: var(--lh-fg-2) !important; }
  html[data-lh-theme] [class*="text-ink-500"] { color: var(--lh-muted) !important; }
  html[data-lh-theme] [class*="text-ink-400"] { color: var(--lh-muted) !important; }
  html[data-lh-theme="dark"] [class*="bg-emerald-50"],
  html[data-lh-theme="dark"] [class*="bg-amber-50"],
  html[data-lh-theme="dark"] [class*="bg-sky-50"],
  html[data-lh-theme="dark"] [class*="bg-indigo-50"],
  html[data-lh-theme="dark"] [class*="bg-violet-50"],
  html[data-lh-theme="dark"] [class*="bg-rose-50"] {
    background-color: color-mix(in srgb, currentColor 14%, var(--lh-surface)) !important;
  }
  .lh-mood { margin-left: 6px; font-size: 15px; line-height: 1; vertical-align: -1px; cursor: default; }
</style>
<script id="lh-dsh-theme-js">
(function () {
  'use strict';
  var root = document.documentElement;
  var WHITE = { r: 255, g: 255, b: 255 };

  function parseColor(c) {
    var m = /rgba?\(([^)]+)\)/.exec(String(c || ''));
    if (!m) return null;
    var p = m[1].split(',').map(function (x) { return parseFloat(x); });
    if (p.length < 3 || isNaN(p[0]) || isNaN(p[1]) || isNaN(p[2])) return null;
    return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ')';
  }
  function mix(a, b, t) {
    return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t };
  }
  function luminance(c) { return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255; }

  // 优先读父页面（同源 iframe）的真实颜色；读不到再退回系统偏好。
  function sampleParent() {
    try {
      var p = window.parent;
      if (!p || p === window || !p.document || !p.document.body) return null;
      var cs = window.getComputedStyle(p.document.body);
      var bg = parseColor(cs.backgroundColor);
      if (!bg || bg.a < 0.05) bg = parseColor(window.getComputedStyle(p.document.documentElement).backgroundColor);
      if (!bg || bg.a < 0.05) bg = null;
      var fg = parseColor(cs.color);
      if (fg && fg.a < 0.05) fg = null;
      return { bg: bg, fg: fg };
    } catch (e) { return null; }
  }

  function apply() {
    var s = sampleParent();
    var dark = s && s.bg
      ? luminance(s.bg) < 0.45
      : (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);
    var bg = (s && s.bg) || (dark ? { r: 18, g: 19, b: 24 } : { r: 243, g: 244, b: 255 });
    var fg = (s && s.fg) || (dark ? { r: 232, g: 234, b: 242 } : { r: 30, g: 33, b: 44 });
    var st = root.style;
    st.setProperty('--lh-bg', rgb(bg));
    st.setProperty('--lh-fg', rgb(fg));
    if (dark) {
      st.setProperty('--lh-surface', rgb(mix(bg, WHITE, 0.09)));
      st.setProperty('--lh-line', rgb(mix(bg, WHITE, 0.18)));
      st.setProperty('--lh-fg-2', rgb(mix(fg, bg, 0.10)));
      st.setProperty('--lh-muted', rgb(mix(fg, bg, 0.34)));
      st.setProperty('--lh-muted-2', rgb(mix(fg, bg, 0.46)));
    } else {
      st.setProperty('--lh-surface', rgb(mix(bg, WHITE, 0.78)));
      st.setProperty('--lh-line', rgb(mix(bg, fg, 0.14)));
      st.setProperty('--lh-fg-2', rgb(mix(fg, bg, 0.18)));
      st.setProperty('--lh-muted', rgb(mix(fg, bg, 0.50)));
      st.setProperty('--lh-muted-2', rgb(mix(fg, bg, 0.60)));
    }
    if (root.getAttribute('data-lh-theme') !== (dark ? 'dark' : 'light')) {
      root.setAttribute('data-lh-theme', dark ? 'dark' : 'light');
    }
    // personas.html 用的是另一套短变量名，一并写入，两个页面共用这一块。
    st.setProperty('--bg', st.getPropertyValue('--lh-bg'));
    st.setProperty('--fg', st.getPropertyValue('--lh-fg'));
    st.setProperty('--card', st.getPropertyValue('--lh-surface'));
    st.setProperty('--line', st.getPropertyValue('--lh-line'));
    st.setProperty('--muted', st.getPropertyValue('--lh-muted'));
  }

  // ── 心情表情：把 /api/workspaces 的 emotion.label 贴到卡片名字后面 ──
  var MOOD_EMOJI = { '中性': '😐', '愉悦': '🙂', '振奋': '😃', '不满': '😕', '低落': '😔' };
  var moodMap = null;

  function personaMoods() {
    return Promise.all([
      fetch('/dsh-lingshu/api/personas', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
      fetch('/dsh-lingshu/api/workspaces', { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
    ]).then(function (res) {
      var personas = (res[0] && res[0].personas) || [];
      var workspaces = (res[1] && res[1].workspaces) || [];
      var byId = {};
      workspaces.forEach(function (w) { byId[w.workspaceId] = w; });
      var map = {};
      personas.forEach(function (p) {
        var hits = (p.bindings || [])
          .map(function (b) { return byId[b.sandbox_id]; })
          .filter(Boolean);
        if (!hits.length) return;
        hits.sort(function (a, b) {
          return (Number(b.isCurrent) - Number(a.isCurrent)) || (Number(b.turns || 0) - Number(a.turns || 0));
        });
        var label = (hits[0].emotion && hits[0].emotion.label) || '中性';
        map[p.persona_id] = {
          label: label,
          emoji: MOOD_EMOJI[label] || '😶',
          from: hits[0].canonicalPath || hits[0].workspaceId || '',
        };
      });
      moodMap = map;
      paintMoods();
    }).catch(function () { /* 拉不到就维持上一轮 */ });
  }

  function paintMoods() {
    if (!moodMap) return;
    var nodes = document.querySelectorAll('.lh-mood[data-pid]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var m = moodMap[el.getAttribute('data-pid')];
      var text = m ? m.emoji : '😶';
      if (el.textContent !== text) el.textContent = text;
      var title = m
        ? '心情：' + m.label + (m.from ? '｜来自 ' + m.from : '')
        : '心情：未知｜该人格体未绑定人格舱';
      if (el.title !== title) el.title = title;
      var aria = '心情：' + (m ? m.label : '未知');
      if (el.getAttribute('aria-label') !== aria) el.setAttribute('aria-label', aria);
    }
  }

  apply();
  try {
    var p = window.parent;
    if (p && p !== window && p.document && window.MutationObserver) {
      new MutationObserver(apply).observe(p.document.documentElement, {
        attributes: true, attributeFilter: ['class', 'style', 'data-theme', 'data-theme-mode'],
      });
    }
  } catch (e) { /* 跨源：只靠轮询 */ }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', apply);
    else if (mq.addListener) mq.addListener(apply);
  }
  window.setInterval(apply, 3000);

  // 卡片重建时 React 会冲掉表情文本，这里重新贴一遍。
  try {
    personaMoods();
    window.setInterval(personaMoods, 15000);
    var host = document.getElementById('root');
    if (host && window.MutationObserver) {
      new MutationObserver(function () { paintMoods(); }).observe(host, { childList: true, subtree: true });
    }
    [200, 600, 1500, 3000].forEach(function (ms) { window.setTimeout(paintMoods, ms); });
  } catch (e) { /* 面板页面才会有这一步 */ }
})();
</script>


</body>
</html>
