# dsh-lingshu bundle patch：把 LINGSHU 插件挂进 profile 的 loader tree。
#
# 与 dsh-novel-writer / dsh-whale-widget 同一套机制：本包在 package.json 里声明
# `dsh.bundle.patch`，被列进 profile 的 `dsh.profile.bundles` 后，loader 会应用这份补丁。
# entry 的 name 就是包名本身，从 profile 的 node_modules 里解析。
- insert:
    - id: lingshu
      name: 'dsh-lingshu'
      config:
        coldTurns: 3
        warmTurns: 20
        warmConfidenceFloor: 0.7
        topK: 3
        tokenBudgetTokens: 900
        archiveThreshold: 0.15
        # 2026-10-28（v1.2 / T-UCA-15）：工具网关判定"路径逃逸"的工作区根。
        # 不配时 index.js 回落 `process.cwd()`——若宿主进程 cwd 不是 D:\LSJH，
        # 工作区内的正常读写会被误判成逃逸（成片 T-UCA-15 误报）→ 必须显式给出。
        workspaceRoot: 'D:/LSJH'
        # 人格体工作区隔离（ADR-017 / P1）：留空 = 沿用历史平铺目录（零回归）。
        # 需要隔离时改成 'code' / 'roleplay' 之类（只接受 [A-Za-z0-9_-]{1,32}）。
        workspaceId: ''
        # 控制论层（v4.2）：数值与 rules/decay-params.yaml#control 保持一致
        contextWindowTokens: 1048576
        charsPerToken: 3
        integralApply: false
        # 影子模式（v4.3 真实标定阶段）：目标/关系误报率高，先只记录不注入
        shadowGoal: true
        shadowRelation: true
        control:
          integralKi: 0.15
          integralCap: 0.4
          integralLeak: 0.05
          integralDeadband: 0.02
          phaseShiftRatio: 0.7
          phaseShiftHardRatio: 0.85
          trendThreshold: 0.02
          ratioMax: 1.5
          historyCapacity: 64
          # v5.3（ADR-014 §6）：沉浸式安全（Soft Buffer）工程量，与 rules/decay-params.yaml#control 同步
          softBufferMaxIntensity: 0.45
          escalateAfterSoftHits: 3
